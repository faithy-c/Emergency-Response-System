{% extends 'base.html' %}

{% block content %}

<div class="section-box">
    <h2>🚨 Live Dispatch Center</h2>

    <table class="table table-dark table-hover">
        <thead>
            <tr>
                <th>User</th>
                <th>Type</th>
                <th>Status</th>
                <th>Location</th>
            </tr>
        </thead>
        <tbody>
            {% for incident in incidents %}
            <tr>
                <td>{{ incident.user.username }}</td>
                <td>{{ incident.incident_type }}</td>
                <td>{{ incident.status }}</td>
                <td>{{ incident.latitude }}, {{ incident.longitude }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
